name: Build and Release WiFi Sync Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Android Release APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK Asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/WiFiSync-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSync-android
          path: dist/WiFiSync-android.apk

  # -------------------------------------------------------------
  # Job 2: Build Linux x64 Release Bundle
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release Bundle
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          mkdir -p dist
          tar -czvf dist/WiFiSync-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSync-linux-x64
          path: dist/WiFiSync-linux-x64.tar.gz

  # -------------------------------------------------------------
  # Job 3: Build Windows x64 Release
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\WiFiSync-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSync-windows-x64
          path: dist\WiFiSync-windows-x64.zip

  # -------------------------------------------------------------
  # Job 4: Publish to GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: WiFiSync-android
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: WiFiSync-linux-x64
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: WiFiSync-windows-x64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
